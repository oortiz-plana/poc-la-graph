services:
  knowledge-ingest:
    profiles: ["synthetic-disabled"]

  graphify:
    build:
      context: .
      dockerfile: docker/graphify-mock.Dockerfile
    image: graphify-agent-poc-graphify-mock:local
    environment:
      GRAPHIFY_RUNTIME_MODE: synthetic
      GRAPHIFY_RUNTIME: mock
      GRAPHIFY_KNOWLEDGE_ROOT: /knowledge
    volumes:
      - graphify_knowledge:/knowledge:ro
    depends_on: !reset
      knowledge-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8001), 2).close()"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  api:
    environment:
      LLM_ADAPTER: mock
      GRAPHIFY_RUNTIME_MODE: synthetic
      GRAPHIFY_PROJECT_PATH: /knowledge/sample-project
      GRAPHIFY_SEARCH_TOOL: search
      KNOWLEDGE_INGEST_ON_STARTUP: "false"
      # PL/SQL analysis console: deterministic fixture mode (ADR 0015).
      PLSQL_ADAPTER: synthetic
      PLSQL_PROJECT_ID: alz
      PLSQL_SOURCE_ROOT: /app/plsql-fixtures/source
    volumes:
      # Read-only fixture source corpus for the source viewer (phase 4).
      - /home/oortiz/oao/Backend:/app/plsql-fixtures:ro

  knowledge-worker:
    environment:
      GRAPHIFY_RUNTIME_MODE: synthetic

  web:
    environment:
      PLSQL_ENABLED: "true"
