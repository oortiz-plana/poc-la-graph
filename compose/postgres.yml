services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-graphify_agent}
      POSTGRES_USER: ${POSTGRES_USER:-graphify_agent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-graphify_agent_local}
    volumes:
      - conversation_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [app]

  api:
    environment:
      CONVERSATION_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-graphify_agent}:${POSTGRES_PASSWORD:-graphify_agent_local}@postgres:5432/${POSTGRES_DB:-graphify_agent}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  conversation_postgres:
