name: ${COMPOSE_PROJECT_NAME:-graphify-agent-poc}

services:
  knowledge-init:
    image: alpine:3.22
    command: ["sh", "-c", "mkdir -p /knowledge/staging /knowledge/graph /knowledge/archive /knowledge/failed /knowledge/state /knowledge/projects && chown -R 10001:10001 /knowledge/staging /knowledge/graph /knowledge/archive /knowledge/failed /knowledge/state /knowledge/projects"]
    volumes:
      - graphify_knowledge:/knowledge
      - ./knowledge/input:/knowledge/input:ro
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    restart: "no"

  knowledge-ingest:
    profiles: ["legacy-single-project"]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: graphify-agent-poc-api:local
    command: ["python", "-m", "app.knowledge.cli", "startup"]
    environment:
      GRAPHIFY_PACKAGE_VERSION: ${GRAPHIFY_PACKAGE_VERSION:-0.9.18}
      GRAPHIFY_EXTRACT_BACKEND: ${GRAPHIFY_EXTRACT_BACKEND:-openai}
      GRAPHIFY_EXTRACT_MODEL: ${GRAPHIFY_EXTRACT_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      KNOWLEDGE_INPUT_DIR: /knowledge/input
      KNOWLEDGE_STAGING_DIR: /knowledge/staging
      KNOWLEDGE_GRAPH_DIR: /knowledge/graph
      KNOWLEDGE_ARCHIVE_DIR: /knowledge/archive
      KNOWLEDGE_FAILED_DIR: /knowledge/failed
      KNOWLEDGE_MANIFEST_PATH: /knowledge/state/manifest.json
      KNOWLEDGE_SOURCE_INDEX_PATH: /knowledge/state/source-index.sqlite
      KNOWLEDGE_INGEST_ON_STARTUP: ${KNOWLEDGE_INGEST_ON_STARTUP:-true}
      KNOWLEDGE_FORCE_REBUILD: ${KNOWLEDGE_FORCE_REBUILD:-false}
      KNOWLEDGE_MAX_DOCUMENT_SIZE_BYTES: ${KNOWLEDGE_MAX_DOCUMENT_SIZE_BYTES:-2097152}
      KNOWLEDGE_MAX_DOCUMENT_COUNT: ${KNOWLEDGE_MAX_DOCUMENT_COUNT:-100}
      KNOWLEDGE_MAX_TOTAL_SOURCE_BYTES: ${KNOWLEDGE_MAX_TOTAL_SOURCE_BYTES:-33554432}
      KNOWLEDGE_MAX_EXTRACTED_DOCUMENT_BYTES: ${KNOWLEDGE_MAX_EXTRACTED_DOCUMENT_BYTES:-8388608}
      KNOWLEDGE_DOCUMENT_PROFILES_JSON: ${KNOWLEDGE_DOCUMENT_PROFILES_JSON:-}
      KNOWLEDGE_GRAPH_VERSIONS_TO_KEEP: ${KNOWLEDGE_GRAPH_VERSIONS_TO_KEEP:-2}
      KNOWLEDGE_BUILD_TIMEOUT_SECONDS: ${KNOWLEDGE_BUILD_TIMEOUT_SECONDS:-1800}
    volumes:
      - graphify_knowledge:/knowledge
      - ./knowledge/input:/knowledge/input:ro
    depends_on:
      knowledge-init:
        condition: service_completed_successfully
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"
    networks: [app]

  graphify:
    build:
      context: .
      dockerfile: docker/graphify.Dockerfile
      args:
        GRAPHIFY_PACKAGE_VERSION: ${GRAPHIFY_PACKAGE_VERSION:-0.9.18}
    image: graphify-agent-poc-graphify:${GRAPHIFY_PACKAGE_VERSION:-0.9.18}
    environment:
      GRAPHIFY_RUNTIME_MODE: ${GRAPHIFY_RUNTIME_MODE:-real}
    volumes:
      - graphify_knowledge:/knowledge:ro
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "/opt/graphify/healthcheck.py"]
      interval: 10s
      timeout: 8s
      retries: 18
      start_period: 20s
    depends_on:
      knowledge-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks: [app]

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    image: graphify-agent-poc-api:local
    environment:
      # PL/SQL analysis console (ships disabled by default; ADR 0011-0015).
      # Neo4j runs outside this stack (sibling `plsqlgraph` repo); reach a
      # host-published instance via the Docker host gateway, not `localhost`.
      PLSQL_ADAPTER: ${PLSQL_ADAPTER:-disabled}
      PLSQL_NEO4J_URI: ${PLSQL_NEO4J_URI:-bolt://host.docker.internal:7687}
      PLSQL_NEO4J_USER: ${PLSQL_NEO4J_USER:-}
      PLSQL_NEO4J_PASSWORD: ${PLSQL_NEO4J_PASSWORD:-}
      PLSQL_PROJECT_ID: ${PLSQL_PROJECT_ID:-sample}
      PLSQL_SOURCE_ROOT: ${PLSQL_SOURCE_ROOT:-/app/plsql-fixtures/source}
      LLM_ADAPTER: ${LLM_ADAPTER:-mock}
      LLM_MODEL: ${LLM_MODEL:-}
      LLM_API_BASE: ${LLM_API_BASE:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_REQUEST_TIMEOUT_SECONDS: ${LLM_REQUEST_TIMEOUT_SECONDS:-45}
      LLM_MAX_RETRIES: ${LLM_MAX_RETRIES:-2}
      GRAPHIFY_ADAPTER: ${GRAPHIFY_ADAPTER:-mcp}
      GRAPHIFY_RUNTIME_MODE: ${GRAPHIFY_RUNTIME_MODE:-real}
      GRAPHIFY_PACKAGE_VERSION: ${GRAPHIFY_PACKAGE_VERSION:-0.9.18}
      GRAPHIFY_MCP_TRANSPORT: ${GRAPHIFY_MCP_TRANSPORT:-http}
      GRAPHIFY_MCP_URL: ${GRAPHIFY_MCP_URL:-http://graphify:8001/mcp}
      GRAPHIFY_PROJECT_ID: ${GRAPHIFY_PROJECT_ID:-sample-project}
      GRAPHIFY_PROJECT_PATH: ${GRAPHIFY_PROJECT_PATH:-/knowledge/graph/active}
      GRAPHIFY_KNOWLEDGE_ROOT: ${GRAPHIFY_KNOWLEDGE_ROOT:-/knowledge}
      GRAPHIFY_REQUEST_TIMEOUT_SECONDS: ${GRAPHIFY_REQUEST_TIMEOUT_SECONDS:-20}
      GRAPHIFY_SEARCH_TOOL: ${GRAPHIFY_SEARCH_TOOL:-query_graph}
      GRAPHIFY_GET_NODE_TOOL: ${GRAPHIFY_GET_NODE_TOOL:-get_node}
      GRAPHIFY_GET_NEIGHBORS_TOOL: ${GRAPHIFY_GET_NEIGHBORS_TOOL:-get_neighbors}
      GRAPHIFY_SHORTEST_PATH_TOOL: ${GRAPHIFY_SHORTEST_PATH_TOOL:-shortest_path}
      AGENT_REQUEST_TIMEOUT_SECONDS: ${AGENT_REQUEST_TIMEOUT_SECONDS:-60}
      AGENT_MAX_TOOL_CALLS: ${AGENT_MAX_TOOL_CALLS:-4}
      AGENT_MAX_TRAVERSAL_DEPTH: ${AGENT_MAX_TRAVERSAL_DEPTH:-2}
      AGENT_MAX_NODES: ${AGENT_MAX_NODES:-100}
      AGENT_MAX_EDGES: ${AGENT_MAX_EDGES:-200}
      AGENT_MAX_EVIDENCE_BYTES: ${AGENT_MAX_EVIDENCE_BYTES:-65536}
      AGENT_MAX_MODEL_ITERATIONS: ${AGENT_MAX_MODEL_ITERATIONS:-2}
      CONVERSATION_DATABASE_URL: ${CONVERSATION_DATABASE_URL:-sqlite+aiosqlite:////knowledge/state/conversations.db}
      CONVERSATION_RETENTION_DAYS: ${CONVERSATION_RETENTION_DAYS:-30}
      CONVERSATION_MAX_TURNS: ${CONVERSATION_MAX_TURNS:-100}
      CONVERSATION_HISTORY_MAX_TURNS: ${CONVERSATION_HISTORY_MAX_TURNS:-6}
      CONVERSATION_HISTORY_MAX_CHARS: ${CONVERSATION_HISTORY_MAX_CHARS:-8000}
      CONVERSATION_REQUEST_LEASE_SECONDS: ${CONVERSATION_REQUEST_LEASE_SECONDS:-300}
      CONVERSATION_CLEANUP_INTERVAL_SECONDS: ${CONVERSATION_CLEANUP_INTERVAL_SECONDS:-3600}
      AUTH_ENABLED: "true"
      AUTH_ISSUER: ${AUTH_ISSUER:-http://localhost:8080/realms/graphify}
      AUTH_AUDIENCE: ${AUTH_AUDIENCE:-graphify-api}
      AUTH_JWKS_URL: ${AUTH_JWKS_URL:-http://keycloak:8080/realms/graphify/protocol/openid-connect/certs}
      AUTH_JWKS_CACHE_SECONDS: ${AUTH_JWKS_CACHE_SECONDS:-300}
      TENANCY_MODE: ${TENANCY_MODE:-fixed}
      TENANT_ID: ${TENANT_ID:-default}
      TENANT_IDS: ${TENANT_IDS:-default}
      AUTH_TENANT_CLAIM: ${AUTH_TENANT_CLAIM:-tenant_id}
      AUTH_GROUPS_CLAIM: ${AUTH_GROUPS_CLAIM:-groups}
      KEYCLOAK_ADMIN_URL: ${KEYCLOAK_ADMIN_URL:-}
      KEYCLOAK_DIRECTORY_TOKEN_URL: ${KEYCLOAK_DIRECTORY_TOKEN_URL:-}
      KEYCLOAK_DIRECTORY_CLIENT_ID: ${KEYCLOAK_DIRECTORY_CLIENT_ID:-}
      KEYCLOAK_DIRECTORY_CLIENT_SECRET: ${KEYCLOAK_DIRECTORY_CLIENT_SECRET:-}
      PROJECT_STORAGE_ROOT: /knowledge/projects
      UPLOAD_SESSION_TTL_HOURS: ${UPLOAD_SESSION_TTL_HOURS:-24}
      PROJECT_ARCHIVE_RETENTION_DAYS: ${PROJECT_ARCHIVE_RETENTION_DAYS:-30}
      CORS_ORIGINS: http://localhost:3000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      KNOWLEDGE_INPUT_DIR: /knowledge/input
      KNOWLEDGE_STAGING_DIR: /knowledge/staging
      KNOWLEDGE_GRAPH_DIR: /knowledge/graph
      KNOWLEDGE_ARCHIVE_DIR: /knowledge/archive
      KNOWLEDGE_FAILED_DIR: /knowledge/failed
      KNOWLEDGE_MANIFEST_PATH: /knowledge/state/manifest.json
      KNOWLEDGE_SOURCE_INDEX_PATH: /knowledge/state/source-index.sqlite
      KNOWLEDGE_INGEST_ON_STARTUP: "false"
      KNOWLEDGE_ADMIN_ENDPOINTS_ENABLED: ${KNOWLEDGE_ADMIN_ENDPOINTS_ENABLED:-true}
      KNOWLEDGE_MAX_DOCUMENT_SIZE_BYTES: ${KNOWLEDGE_MAX_DOCUMENT_SIZE_BYTES:-2097152}
      KNOWLEDGE_MAX_DOCUMENT_COUNT: ${KNOWLEDGE_MAX_DOCUMENT_COUNT:-100}
      KNOWLEDGE_MAX_TOTAL_SOURCE_BYTES: ${KNOWLEDGE_MAX_TOTAL_SOURCE_BYTES:-33554432}
      KNOWLEDGE_MAX_EXTRACTED_DOCUMENT_BYTES: ${KNOWLEDGE_MAX_EXTRACTED_DOCUMENT_BYTES:-8388608}
      KNOWLEDGE_DOCUMENT_PROFILES_JSON: ${KNOWLEDGE_DOCUMENT_PROFILES_JSON:-}
      KNOWLEDGE_GRAPH_VERSIONS_TO_KEEP: ${KNOWLEDGE_GRAPH_VERSIONS_TO_KEEP:-2}
      GRAPHIFY_EXTRACT_BACKEND: ${GRAPHIFY_EXTRACT_BACKEND:-openai}
      GRAPHIFY_EXTRACT_MODEL: ${GRAPHIFY_EXTRACT_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
    ports:
      - "8000:8000"
    volumes:
      - graphify_knowledge:/knowledge
      - ./knowledge/input:/knowledge/input:ro
      # Read-only PL/SQL source root for the analysis console; defaults to
      # the repo's synthetic fixture corpus, override PLSQL_SOURCE_HOST_PATH
      # in .env to point at a real analyzed corpus for PLSQL_ADAPTER=neo4j.
      - ${PLSQL_SOURCE_HOST_PATH:-./apps/api/tests/fixtures/plsql}:/app/plsql-fixtures:ro
    extra_hosts:
      # Lets PLSQL_NEO4J_URI reach a Neo4j instance published on the Docker
      # host (e.g. the sibling `plsqlgraph` stack) via host.docker.internal.
      - "host.docker.internal:host-gateway"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      graphify:
        condition: service_healthy
      keycloak:
        condition: service_started
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    init: true
    restart: unless-stopped
    networks: [app]

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    image: graphify-agent-poc-web:local
    environment:
      PLSQL_ENABLED: ${PLSQL_ENABLED:-false}
      API_INTERNAL_URL: ${API_INTERNAL_URL:-http://api:8000}
      KEYCLOAK_URL: ${KEYCLOAK_URL:-http://localhost:8080}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-graphify}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID:-graphify-web}
      UPLOAD_MAX_FILE_BYTES: ${KNOWLEDGE_MAX_DOCUMENT_SIZE_BYTES:-2097152}
      UPLOAD_MAX_FILES: ${KNOWLEDGE_MAX_DOCUMENT_COUNT:-100}
      UPLOAD_MAX_TOTAL_BYTES: ${KNOWLEDGE_MAX_TOTAL_SOURCE_BYTES:-33554432}
    ports:
      - "3000:3000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s
    init: true
    restart: unless-stopped
    networks: [app]

  knowledge-worker:
    image: graphify-agent-poc-api:local
    command: ["python", "-m", "app.projects.worker"]
    environment:
      CONVERSATION_DATABASE_URL: ${CONVERSATION_DATABASE_URL:-sqlite+aiosqlite:////knowledge/state/conversations.db}
      PROJECT_STORAGE_ROOT: /knowledge/projects
      GRAPHIFY_RUNTIME_MODE: ${GRAPHIFY_RUNTIME_MODE:-real}
      GRAPHIFY_PACKAGE_VERSION: ${GRAPHIFY_PACKAGE_VERSION:-0.9.18}
      GRAPHIFY_EXTRACT_BACKEND: ${GRAPHIFY_EXTRACT_BACKEND:-openai}
      GRAPHIFY_EXTRACT_MODEL: ${GRAPHIFY_EXTRACT_MODEL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-}
      KNOWLEDGE_MAX_DOCUMENT_SIZE_BYTES: ${KNOWLEDGE_MAX_DOCUMENT_SIZE_BYTES:-2097152}
      KNOWLEDGE_MAX_DOCUMENT_COUNT: ${KNOWLEDGE_MAX_DOCUMENT_COUNT:-100}
      KNOWLEDGE_MAX_TOTAL_SOURCE_BYTES: ${KNOWLEDGE_MAX_TOTAL_SOURCE_BYTES:-33554432}
      KNOWLEDGE_MAX_EXTRACTED_DOCUMENT_BYTES: ${KNOWLEDGE_MAX_EXTRACTED_DOCUMENT_BYTES:-8388608}
      KNOWLEDGE_DOCUMENT_PROFILES_JSON: ${KNOWLEDGE_DOCUMENT_PROFILES_JSON:-}
      KNOWLEDGE_BUILD_TIMEOUT_SECONDS: ${KNOWLEDGE_BUILD_TIMEOUT_SECONDS:-1800}
      KNOWLEDGE_WORKER_POLL_SECONDS: ${KNOWLEDGE_WORKER_POLL_SECONDS:-1}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - graphify_knowledge:/knowledge
    depends_on:
      api:
        condition: service_healthy
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    init: true
    restart: unless-stopped
    networks: [app]

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USERNAME:-}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:-}
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak/import:/opt/keycloak/data/import:ro
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    networks: [app]

volumes:
  graphify_knowledge:
  keycloak_data:

networks:
  app:
    driver: bridge
