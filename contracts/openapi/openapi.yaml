openapi: 3.1.0
info:
  title: Graphify Knowledge Agent API
  description: Authenticated multi-project API with named SSE conversation streams.
  version: 1.0.0-poc
paths:
  /health:
    get:
      tags:
      - system
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /ready:
    get:
      tags:
      - system
      summary: Readiness
      operationId: readiness_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
        '503':
          description: Service Unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Readiness'
  /api/v1/conversations:
    post:
      tags:
      - conversations
      summary: Create Conversation
      operationId: create_conversation_api_v1_conversations_post
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/CreateConversationRequest'
              - type: 'null'
              title: Body
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/projects/{project_id}/conversations:
    get:
      tags:
      - conversations
      summary: List Conversations
      operationId: list_conversations_api_v1_projects__project_id__conversations_get
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      - name: state
        in: query
        required: false
        schema:
          enum:
          - active
          - archived
          type: string
          default: active
          title: State
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 50
          title: Limit
      - name: cursor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 1024
          - type: 'null'
          title: Cursor
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversationList'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/conversations/{conversation_id}:
    get:
      tags:
      - conversations
      summary: Get Conversation
      operationId: get_conversation_api_v1_conversations__conversation_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          title: Conversation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    patch:
      tags:
      - conversations
      summary: Rename Conversation
      operationId: rename_conversation_api_v1_conversations__conversation_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          title: Conversation Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateConversationRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - conversations
      summary: Delete Conversation
      operationId: delete_conversation_api_v1_conversations__conversation_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          title: Conversation Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/conversations/{conversation_id}/restore:
    post:
      tags:
      - conversations
      summary: Restore Conversation
      operationId: restore_conversation_api_v1_conversations__conversation_id__restore_post
      security:
      - HTTPBearer: []
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          title: Conversation Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conversation'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/conversations/{conversation_id}/purge:
    delete:
      tags:
      - conversations
      summary: Purge Conversation
      operationId: purge_conversation_api_v1_conversations__conversation_id__purge_delete
      security:
      - HTTPBearer: []
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          title: Conversation Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/conversations/{conversation_id}/messages:
    post:
      tags:
      - conversations
      summary: Send Message
      operationId: send_message_api_v1_conversations__conversation_id__messages_post
      security:
      - HTTPBearer: []
      parameters:
      - name: conversation_id
        in: path
        required: true
        schema:
          type: string
          title: Conversation Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SendMessageRequest'
      responses:
        '200':
          description: Successful Response
          content:
            text/event-stream:
              schema:
                type: string
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/projects:
    get:
      tags:
      - projects
      summary: List Projects
      operationId: list_projects_api_v1_projects_get
      security:
      - HTTPBearer: []
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Project'
                title: Response List Projects Api V1 Projects Get
    post:
      tags:
      - projects
      summary: Create Project
      operationId: create_project_api_v1_projects_post
      security:
      - HTTPBearer: []
      parameters:
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateProjectRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/projects/{project_id}:
    delete:
      tags:
      - projects
      summary: Purge Project
      operationId: purge_project_api_v1_projects__project_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - projects
      summary: Get Project
      operationId: get_project_api_v1_projects__project_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/projects/{project_id}/archive:
    post:
      tags:
      - projects
      summary: Archive Project
      operationId: archive_project_api_v1_projects__project_id__archive_post
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/projects/{project_id}/restore:
    post:
      tags:
      - projects
      summary: Restore Project
      operationId: restore_project_api_v1_projects__project_id__restore_post
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/projects/{project_id}/upload-sessions:
    post:
      tags:
      - projects
      summary: Create Upload Session
      operationId: create_upload_session_api_v1_projects__project_id__upload_sessions_post
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
          title: Idempotency-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUploadSessionRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadSession'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/projects/{project_id}/upload-sessions/{session_id}/parts/{part_id}:
    put:
      tags:
      - projects
      summary: Upload Part
      operationId: upload_part_api_v1_projects__project_id__upload_sessions__session_id__parts__part_id__put
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: part_id
        in: path
        required: true
        schema:
          type: string
          title: Part Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/projects/{project_id}/upload-sessions/{session_id}/finalize:
    post:
      tags:
      - projects
      summary: Finalize Upload
      operationId: finalize_upload_api_v1_projects__project_id__upload_sessions__session_id__finalize_post
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      - name: session_id
        in: path
        required: true
        schema:
          type: string
          title: Session Id
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
          title: Idempotency-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SnapshotFile'
                title: Response Finalize Upload Api V1 Projects  Project Id  Upload
                  Sessions  Session Id  Finalize Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/projects/{project_id}/files:
    get:
      tags:
      - projects
      summary: List Files
      operationId: list_files_api_v1_projects__project_id__files_get
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/SnapshotFile'
                title: Response List Files Api V1 Projects  Project Id  Files Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/projects/{project_id}/files/{file_id}:
    delete:
      tags:
      - projects
      summary: Delete File
      operationId: delete_file_api_v1_projects__project_id__files__file_id__delete
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      - name: file_id
        in: path
        required: true
        schema:
          type: string
          title: File Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/projects/{project_id}/builds:
    post:
      tags:
      - projects
      summary: Create Build
      operationId: create_build_api_v1_projects__project_id__builds_post
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      - name: Idempotency-Key
        in: header
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 255
          title: Idempotency-Key
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildAccepted'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/projects/{project_id}/builds/{build_id}:
    get:
      tags:
      - projects
      summary: Get Build
      operationId: get_build_api_v1_projects__project_id__builds__build_id__get
      security:
      - HTTPBearer: []
      parameters:
      - name: project_id
        in: path
        required: true
        schema:
          type: string
          title: Project Id
      - name: build_id
        in: path
        required: true
        schema:
          type: string
          title: Build Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BuildSummary'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/knowledge/ingestions:
    post:
      tags:
      - knowledge administration
      summary: Start a development-only graph rebuild
      operationId: create_ingestion_api_v1_knowledge_ingestions_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IngestionRequest'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionAccepted'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/knowledge/ingestions/current:
    get:
      tags:
      - knowledge administration
      summary: Current Ingestion
      operationId: current_ingestion_api_v1_knowledge_ingestions_current_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestionStatus'
      security:
      - HTTPBearer: []
  /api/v1/knowledge/graph:
    get:
      tags:
      - knowledge administration
      summary: Graph Status
      operationId: graph_status_api_v1_knowledge_graph_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeGraphStatus'
      security:
      - HTTPBearer: []
components:
  schemas:
    AllowedActions:
      properties:
        createConversation:
          type: boolean
          title: Createconversation
        editDraft:
          type: boolean
          title: Editdraft
        build:
          type: boolean
          title: Build
        archive:
          type: boolean
          title: Archive
        restore:
          type: boolean
          title: Restore
        purge:
          type: boolean
          title: Purge
      additionalProperties: false
      type: object
      required:
      - createConversation
      - editDraft
      - build
      - archive
      - restore
      - purge
      title: AllowedActions
    Answer:
      properties:
        requestId:
          type: string
          title: Requestid
        conversationId:
          type: string
          title: Conversationid
        answer:
          type: string
          title: Answer
        status:
          type: string
          const: completed
          title: Status
          default: completed
        responseType:
          type: string
          enum:
          - answer
          - clarification
          - insufficient
          title: Responsetype
          default: answer
        confidence:
          type: string
          enum:
          - high
          - medium
          - low
          - insufficient
          title: Confidence
        graphVersion:
          anyOf:
          - type: string
          - type: 'null'
          title: Graphversion
        citations:
          items:
            $ref: '#/components/schemas/Citation'
          type: array
          title: Citations
        graphEvidence:
          $ref: '#/components/schemas/GraphEvidence'
        warnings:
          items:
            type: string
          type: array
          title: Warnings
      additionalProperties: false
      type: object
      required:
      - requestId
      - conversationId
      - answer
      - confidence
      - graphEvidence
      title: Answer
    BuildAccepted:
      properties:
        buildId:
          type: string
          title: Buildid
        status:
          type: string
          const: queued
          title: Status
          default: queued
      additionalProperties: false
      type: object
      required:
      - buildId
      title: BuildAccepted
    BuildSummary:
      properties:
        id:
          type: string
          title: Id
        status:
          type: string
          enum:
          - queued
          - building
          - ready
          - failed
          title: Status
        errorCode:
          anyOf:
          - type: string
          - type: 'null'
          title: Errorcode
        createdAt:
          type: string
          format: date-time
          title: Createdat
        startedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Startedat
        completedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completedat
      additionalProperties: false
      type: object
      required:
      - id
      - status
      - createdAt
      title: BuildSummary
    Citation:
      properties:
        id:
          type: string
          title: Id
        title:
          type: string
          title: Title
        source:
          type: string
          title: Source
        nodeId:
          anyOf:
          - type: string
          - type: 'null'
          title: Nodeid
        relationship:
          anyOf:
          - type: string
          - type: 'null'
          title: Relationship
        provenance:
          type: string
          enum:
          - explicit
          - extracted
          - inferred
          - unknown
          title: Provenance
          default: unknown
        excerpt:
          anyOf:
          - type: string
          - type: 'null'
          title: Excerpt
        document:
          anyOf:
          - type: string
          - type: 'null'
          title: Document
        article:
          anyOf:
          - type: string
          - type: 'null'
          title: Article
        paragraph:
          anyOf:
          - type: string
          - type: 'null'
          title: Paragraph
        startLine:
          anyOf:
          - type: integer
          - type: 'null'
          title: Startline
        endLine:
          anyOf:
          - type: integer
          - type: 'null'
          title: Endline
        pageNumber:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Pagenumber
        sectionPath:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
          title: Sectionpath
      additionalProperties: false
      type: object
      required:
      - id
      - title
      - source
      title: Citation
    Conversation:
      properties:
        id:
          type: string
          title: Id
        projectId:
          type: string
          title: Projectid
        name:
          type: string
          title: Name
        createdAt:
          type: string
          format: date-time
          title: Createdat
        updatedAt:
          type: string
          format: date-time
          title: Updatedat
        archivedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Archivedat
        messages:
          items:
            $ref: '#/components/schemas/Message'
          type: array
          title: Messages
      additionalProperties: false
      type: object
      required:
      - id
      - projectId
      - name
      - createdAt
      - updatedAt
      - archivedAt
      title: Conversation
    ConversationList:
      properties:
        items:
          items:
            $ref: '#/components/schemas/ConversationSummary'
          type: array
          maxItems: 100
          title: Items
        nextCursor:
          anyOf:
          - type: string
          - type: 'null'
          title: Nextcursor
      additionalProperties: false
      type: object
      required:
      - items
      - nextCursor
      title: ConversationList
    ConversationSummary:
      properties:
        id:
          type: string
          title: Id
        projectId:
          type: string
          title: Projectid
        name:
          type: string
          title: Name
        createdAt:
          type: string
          format: date-time
          title: Createdat
        updatedAt:
          type: string
          format: date-time
          title: Updatedat
        archivedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Archivedat
      additionalProperties: false
      type: object
      required:
      - id
      - projectId
      - name
      - createdAt
      - updatedAt
      - archivedAt
      title: ConversationSummary
    CreateConversationRequest:
      properties:
        projectId:
          anyOf:
          - type: string
            maxLength: 128
            minLength: 1
          - type: 'null'
          title: Projectid
      additionalProperties: false
      type: object
      title: CreateConversationRequest
    CreateProjectRequest:
      properties:
        name:
          type: string
          maxLength: 120
          minLength: 1
          title: Name
        description:
