          type: string
          title: Title
        source:
          type: string
          title: Source
        nodeId:
          anyOf:
          - type: string
          - type: 'null'
          title: Nodeid
        relationship:
          anyOf:
          - type: string
          - type: 'null'
          title: Relationship
        provenance:
          type: string
          enum:
          - explicit
          - extracted
          - inferred
          - unknown
          title: Provenance
          default: unknown
        excerpt:
          anyOf:
          - type: string
          - type: 'null'
          title: Excerpt
        document:
          anyOf:
          - type: string
          - type: 'null'
          title: Document
        article:
          anyOf:
          - type: string
          - type: 'null'
          title: Article
        paragraph:
          anyOf:
          - type: string
          - type: 'null'
          title: Paragraph
        startLine:
          anyOf:
          - type: integer
          - type: 'null'
          title: Startline
        endLine:
          anyOf:
          - type: integer
          - type: 'null'
          title: Endline
        pageNumber:
          anyOf:
          - type: integer
            minimum: 1.0
          - type: 'null'
          title: Pagenumber
        sectionPath:
          anyOf:
          - items:
              type: string
            type: array
          - type: 'null'
