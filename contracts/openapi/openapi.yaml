          title: Id
        projectId:
          type: string
          title: Projectid
        name:
          type: string
          title: Name
        createdAt:
          type: string
          format: date-time
          title: Createdat
        updatedAt:
          type: string
          format: date-time
          title: Updatedat
        archivedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Archivedat
      additionalProperties: false
      type: object
      required:
      - id
      - projectId
      - name
      - createdAt
      - updatedAt
      - archivedAt
      title: ConversationSummary
    CreateAccessRequest:
