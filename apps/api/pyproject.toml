[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "graphify-knowledge-agent-api"
version = "0.1.0"
description = "FastAPI and LangGraph Graphify knowledge-agent POC"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20,<1",
  "alembic>=1.14,<2",
  "asyncpg>=0.30,<1",
  "fastapi>=0.115,<1",
  "graphifyy[mcp,openai]==0.9.18",
  "haystack-ai==2.31.0",
  "httpx>=0.27,<1",
  "langgraph>=0.2,<2",
  "litellm>=1.50,<2",
  "mcp==1.29.0",
  "neo4j>=5.26,<6",
  "pypdf>=5,<6",
  "python-docx>=1.1,<2",
  "opentelemetry-api>=1.27,<2",
  "opentelemetry-instrumentation-fastapi>=0.48b0,<1",
  "opentelemetry-instrumentation-httpx>=0.48b0,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "PyJWT[crypto]>=2.9,<3",
  "sse-starlette>=2.1,<4",
  "structlog>=24.4,<26",
  "sqlalchemy[asyncio]>=2.0.36,<3",
  "tiktoken>=0.9,<1",
  "trafilatura>=2,<3",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "respx>=0.21,<1",
  "ruff>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]

[[tool.mypy.overrides]]
module = ["litellm.*", "mcp.*", "opentelemetry.instrumentation.*", "sse_starlette.*"]
ignore_missing_imports = true
