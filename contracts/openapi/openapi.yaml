        membershipId:
          type: string
          title: Membershipid
        principalType:
          type: string
          enum:
          - user
          - group
          title: Principaltype
        principalId:
          type: string
          title: Principalid
        displayName:
          type: string
          title: Displayname
        role:
          type: string
          enum:
          - viewer
          - contributor
          - manager
          - owner
          title: Role
      additionalProperties: false
      type: object
      required:
      - membershipId
      - principalType
      - principalId
      - displayName
      - role
      title: AccessOrigin
    AccessRequestContext:
      properties:
        projectId:
          type: string
