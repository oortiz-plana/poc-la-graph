          - available
          - pending
          - denied
          title: Status
        requestId:
          anyOf:
          - type: string
          - type: 'null'
          title: Requestid
      additionalProperties: false
      type: object
      required:
      - projectId
      - projectName
      - status
      title: AccessRequestContext
    AddMembershipItem:
      properties:
        principalType:
          type: string
          enum:
          - user
          - group
          title: Principaltype
        principalId:
          type: string
          maxLength: 255
          minLength: 1
          title: Principalid
        displayName:
          type: string
          maxLength: 255
          minLength: 1
          title: Displayname
      additionalProperties: false
      type: object
      required:
      - principalType
      - principalId
      - displayName
      title: AddMembershipItem
    AddMembershipsRequest:
      properties:
        principals:
          items:
            $ref: '#/components/schemas/AddMembershipItem'
          type: array
          maxItems: 50
          minItems: 1
          title: Principals
        role:
          type: string
          enum:
          - viewer
          - contributor
          - manager
          title: Role
      additionalProperties: false
      type: object
      required:
      - principals
      - role
      title: AddMembershipsRequest
    AllowedActions:
      properties:
        createConversation:
          type: boolean
          title: Createconversation
        editDraft:
          type: boolean
          title: Editdraft
        build:
          type: boolean
          title: Build
        archive:
          type: boolean
          title: Archive
        restore:
          type: boolean
          title: Restore
        purge:
          type: boolean
          title: Purge
        manageAccess:
          type: boolean
          title: Manageaccess
          default: false
        viewAccessActivity:
          type: boolean
          title: Viewaccessactivity
          default: false
        requestAccess:
          type: boolean
          title: Requestaccess
          default: false
      additionalProperties: false
      type: object
      required:
      - createConversation
      - editDraft
      - build
      - archive
      - restore
      - purge
      title: AllowedActions
    Answer:
      properties:
        requestId:
          type: string
          title: Requestid
        conversationId:
          type: string
          title: Conversationid
        answer:
          type: string
          title: Answer
        status:
          type: string
          const: completed
          title: Status
          default: completed
        responseType:
          type: string
          enum:
          - answer
          - clarification
          - insufficient
          title: Responsetype
          default: answer
        confidence:
          type: string
          enum:
          - high
          - medium
          - low
          - insufficient
          title: Confidence
        graphVersion:
          anyOf:
          - type: string
          - type: 'null'
          title: Graphversion
        citations:
          items:
            $ref: '#/components/schemas/Citation'
          type: array
          title: Citations
        graphEvidence:
          $ref: '#/components/schemas/GraphEvidence'
        warnings:
          items:
            type: string
          type: array
          title: Warnings
