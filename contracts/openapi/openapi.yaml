    PlsqlImpactItem:
      properties:
        id:
          type: string
          maxLength: 512
          minLength: 1
          title: Id
        dependent:
          $ref: '#/components/schemas/PlsqlObjectReference'
        distance:
          type: integer
          minimum: 1.0
          title: Distance
        paths:
          items:
            $ref: '#/components/schemas/PlsqlPath'
          type: array
          title: Paths
      additionalProperties: false
      type: object
      required:
      - id
      - dependent
      - distance
      - paths
      title: PlsqlImpactItem
      description: |-
        One transitive dependent of a changed object.

        ``distance`` is the shortest number of hops from the dependent to the
        changed object; ``paths`` holds the shortest explaining paths
        (dependent → … → changed object) with per-hop evidence. No severity is
        attached: scope is explained by the paths alone.

    PlsqlImpactResult:
      properties:
        object:
          $ref: '#/components/schemas/PlsqlObjectReference'
        items:
          items:
            $ref: '#/components/schemas/PlsqlImpactItem'
          type: array
          title: Items
        truncated:
          type: boolean
          title: Truncated
        count:
          type: integer
          minimum: 0.0
          title: Count
      additionalProperties: false
      type: object
      required:
      - object
      - items
      - truncated
      - count
      title: PlsqlImpactResult
      description: |-
        Deterministic, bounded impact report for one changed object.

        ``object`` identifies the analyzed object; ``items`` are its transitive
        dependents ordered by distance and then lexicographic ids.

