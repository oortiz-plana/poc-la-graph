  /api/v1/plsql/files:
    get:
      tags:
      - plsql
      summary: Get File Source
      description: |-
        Return read-only source text for one file of the analyzed corpus.

        ``startLine``/``endLine`` are optional request ranges echoed as the
        highlight for the viewer. Unknown file ids and traversal attempts are
        rejected as ``analysis_not_found``; oversized files are capped by
        ``plsql_max_source_bytes``.
      operationId: get_file_source_api_v1_plsql_files_get
      security:
      - HTTPBearer: []
      parameters:
      - name: fileId
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 512
          title: Fileid
      - name: startLine
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          title: Startline
      - name: endLine
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          title: Endline
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlsqlSourceContent'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /api/v1/plsql/impact:
    get:
      tags:
      - plsql
      summary: Get Impact
      description: |-
        Return bounded transitive dependents of a changed object.

        Dependents reach the changed object over typed dependency relationships
        (``CALLS | READS | WRITES | VIEW_DEPENDS_ON``) within
        ``plsql_max_hops``; items are ordered by distance and then lexicographic
        ids, and every item carries its shortest explaining path(s) with per-hop
        evidence. No severity is computed or persisted.
      operationId: get_impact_api_v1_plsql_impact_get
      security:
      - HTTPBearer: []
      parameters:
      - name: objectId
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 512
          title: Objectid
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 200
            minimum: 1
          - type: 'null'
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlsqlImpactResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /api/v1/plsql/object:
    get:
      tags:
      - plsql
      summary: Get Object
      description: 'Return one analyzed PL/SQL object by its opaque identifier.


        Identifiers embed ``/`` characters (``plsql://...``), so the identifier

        travels as a query parameter instead of a path segment to survive

        proxies and routers without double encoding.'
      operationId: get_object_api_v1_plsql_object_get
      security:
      - HTTPBearer: []
      parameters:
      - name: objectId
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 512
          title: Objectid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlsqlObject'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /api/v1/plsql/objects:
    get:
      tags:
      - plsql
      summary: Search Objects
      description: Deterministically search analyzed PL/SQL objects (bounded).
      operationId: search_objects_api_v1_plsql_objects_get
      security:
      - HTTPBearer: []
      parameters:
      - name: q
        in: query
        required: false
        schema:
          type: string
          maxLength: 200
          default: ''
          title: Q
      - name: kinds
        in: query
        required: false
        schema:
          anyOf:
          - type: array
            items:
              enum:
              - Table
              - View
              - Package
              - Sequence
              - Trigger
              - Index
              - Synonym
              - Type
              - Procedure
              - Function
              - AnonymousBlock
              type: string
          - type: 'null'
          title: Kinds
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 200
            minimum: 1
          - type: 'null'
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlsqlObjectSearchResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /api/v1/plsql/paths:
    get:
      tags:
      - plsql
      summary: Find Paths
      description: |-
        Return bounded dependency paths from one object to another.

        Paths traverse typed dependency relationships (``CALLS | READS | WRITES |
        VIEW_DEPENDS_ON``) within ``plsql_max_hops``, ordered by hop count then
        lexicographic node ids, with duplicates collapsed and truncation reported
        when the row cap is hit.
      operationId: find_paths_api_v1_plsql_paths_get
      security:
      - HTTPBearer: []
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 512
          title: From
      - name: to
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 512
          title: To
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 200
            minimum: 1
          - type: 'null'
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlsqlPathResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /api/v1/plsql/relationships/evidence:
    get:
      tags:
      - plsql
      summary: Get Relationship Evidence
      description: |-
        Return one typed relationship with its source evidence coordinates.

        Identifiers embed ``/`` characters (``edge://...``), so the identifier
        travels as a query parameter instead of a path segment.
      operationId: get_relationship_evidence_api_v1_plsql_relationships_evidence_get
      security:
      - HTTPBearer: []
      parameters:
      - name: relationshipId
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 512
          title: Relationshipid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlsqlDependency'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /api/v1/plsql/source:
    get:
      tags:
      - plsql
      summary: Get Object Source
      description: |-
        Return read-only source text for an analyzed object.

        The response highlights the object's declaration line. Content is served
        strictly under the configured ``plsql_source_root`` with traversal guards
        and the configured byte cap.
      operationId: get_object_source_api_v1_plsql_source_get
      security:
      - HTTPBearer: []
      parameters:
      - name: objectId
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 512
          title: Objectid
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlsqlSourceContent'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /api/v1/plsql/table-access:
    get:
      tags:
      - plsql
      summary: List Table Access
      description: Return READS/WRITES/TRIGGER_ON/VIEW_DEPENDS_ON edges of an object.
      operationId: list_table_access_api_v1_plsql_table_access_get
      security:
      - HTTPBearer: []
      parameters:
      - name: objectId
        in: query
        required: true
        schema:
          type: string
          minLength: 1
          maxLength: 512
          title: Objectid
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 200
            minimum: 1
          - type: 'null'
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlsqlDependencyResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

  /api/v1/plsql/unresolved:
    get:
      tags:
      - plsql
      summary: List Unresolved
      description: |-
        Return edges whose resolution is AMBIGUOUS or UNRESOLVED.

        Uncertainty is surfaced as data: these edges are never presented as
        certain relationships by the console.
      operationId: list_unresolved_api_v1_plsql_unresolved_get
      security:
      - HTTPBearer: []
      parameters:
      - name: limit
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            maximum: 200
            minimum: 1
          - type: 'null'
          title: Limit
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlsqlDependencyResult'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
