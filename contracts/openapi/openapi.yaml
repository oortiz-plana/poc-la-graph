          type: string
          title: Projectid
        name:
          type: string
          title: Name
        createdAt:
          type: string
          format: date-time
          title: Createdat
        updatedAt:
          type: string
          format: date-time
          title: Updatedat
        archivedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Archivedat
        messages:
          items:
            $ref: '#/components/schemas/Message'
          type: array
          title: Messages
