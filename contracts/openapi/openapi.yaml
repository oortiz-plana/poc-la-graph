          - failed
          title: Status
        errorCode:
          anyOf:
          - type: string
          - type: 'null'
          title: Errorcode
        createdAt:
          type: string
          format: date-time
          title: Createdat
        startedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Startedat
        completedAt:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completedat
